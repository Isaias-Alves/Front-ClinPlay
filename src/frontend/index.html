<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10b981" />
    <meta
      name="description"
      content="ClinPlaY — plataforma de biofeedback gamificado para tratamentos de fisioterapia."
    />

    <!-- PWA: torna o app instalável na tela inicial. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      iOS ignora o manifest para instalação: o Safari lê estas meta tags.
      Sem `apple-touch-icon` o atalho vira uma miniatura da página; sem
      `apple-mobile-web-app-capable` o app abre dentro do Safari, com a barra
      de endereço ocupando a tela.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ClinPlaY" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>ClinPlaY</title>

    <!--
      Aplica tema e contraste ANTES do React montar.

      Se isso rodasse dentro do app, quem escolheu o modo escuro veria um
      flash branco a cada abertura — e num PWA aberto pela tela inicial, a
      cada retomada. Inline e síncrono de propósito: precisa bloquear a
      primeira pintura.
    -->
    <script>
      (function () {
        try {
          var ls = window.localStorage;
          var tema = ls.getItem("clinplay:tema");
          var contraste = ls.getItem("clinplay:contraste");
          var mq = window.matchMedia;

          var escuro =
            tema === "escuro" ||
            (tema === null && mq && mq("(prefers-color-scheme: dark)").matches);
          var alto =
            contraste === "alto" ||
            (contraste === null && mq && mq("(prefers-contrast: more)").matches);

          var raiz = document.documentElement;
          raiz.dataset.tema = escuro ? "escuro" : "claro";
          raiz.dataset.contraste = alto ? "alto" : "normal";
          raiz.style.colorScheme = escuro ? "dark" : "light";

          if (escuro) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#060b16");
          }
        } catch (e) {
          /* Sem localStorage (modo privado) o app abre no tema claro. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
